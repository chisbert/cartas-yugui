<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f17"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="25%" stop-color="#f59e0b"/>
      <stop offset="70%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>
    <linearGradient id="cardGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0.2"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background rounded squircle -->
  <rect width="512" height="512" rx="100" fill="url(#bg)"/>
  <rect x="12" y="12" width="488" height="488" rx="88" fill="none" stroke="url(#gold)" stroke-width="6" stroke-opacity="0.6"/>

  <!-- Card 1 back (angled) -->
  <g transform="translate(190, 240) rotate(-14) translate(-100, -140)">
    <rect width="180" height="260" rx="14" fill="#1e1b4b" stroke="#6366f1" stroke-width="4" stroke-opacity="0.7"/>
    <rect x="15" y="15" width="150" height="230" rx="8" fill="#0f172a" stroke="#818cf8" stroke-width="2" stroke-opacity="0.4"/>
    <circle cx="90" cy="130" r="35" fill="none" stroke="#818cf8" stroke-width="3" stroke-dasharray="6,4"/>
  </g>

  <!-- Card 2 front (center) with Gold Millennium Eye / Puzzle motif -->
  <g transform="translate(256, 260) rotate(6) translate(-100, -140)" filter="url(#glow)">
    <rect width="200" height="280" rx="16" fill="#18181b" stroke="url(#gold)" stroke-width="8"/>
    <!-- Card Frame Interior -->
    <rect x="16" y="18" width="168" height="180" rx="10" fill="#0f172a" stroke="url(#gold)" stroke-width="3"/>
    
    <!-- Millennium Eye Symbol -->
    <g transform="translate(100, 108)">
      <!-- Eyebrow/Arc -->
      <path d="M-45,-25 Q0,-50 45,-25" fill="none" stroke="url(#gold)" stroke-width="6" stroke-linecap="round"/>
      <!-- Eye contour -->
      <path d="M-45,-10 Q0,25 45,-10 Q0,-40 -45,-10 Z" fill="url(#gold)" opacity="0.25"/>
      <path d="M-45,-10 Q0,25 45,-10 Q0,-40 -45,-10 Z" fill="none" stroke="url(#gold)" stroke-width="5"/>
      <!-- Pupil & Iris -->
      <circle cx="0" cy="-6" r="14" fill="#0b0f17" stroke="url(#gold)" stroke-width="4"/>
      <circle cx="0" cy="-6" r="6" fill="url(#gold)"/>
      <circle cx="3" cy="-9" r="2.5" fill="#ffffff"/>
      <!-- Lower decorative drops -->
      <path d="M0,15 L0,32" stroke="url(#gold)" stroke-width="5" stroke-linecap="round"/>
      <path d="M-20,10 L-26,24" stroke="url(#gold)" stroke-width="4" stroke-linecap="round"/>
      <path d="M20,10 L26,24" stroke="url(#gold)" stroke-width="4" stroke-linecap="round"/>
    </g>

    <!-- Card bottom label box -->
    <rect x="16" y="210" width="168" height="52" rx="6" fill="#090d16" stroke="url(#gold)" stroke-width="2"/>
    <text x="100" y="235" font-family="'Cinzel', serif, sans-serif" font-weight="900" font-size="16" fill="#fef08a" text-anchor="middle" letter-spacing="3">YU-GI-OH!</text>
    <text x="100" y="252" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="10" fill="#fbbf24" text-anchor="middle" letter-spacing="1">TCG EUROPA</text>
  </g>

  <!-- Sparkles -->
  <g fill="#fef08a" opacity="0.9">
    <path d="M80,100 Q95,100 95,85 Q95,100 110,100 Q95,100 95,115 Q95,100 80,100 Z"/>
    <path d="M420,140 Q430,140 430,130 Q430,140 440,140 Q430,140 430,150 Q430,140 420,140 Z"/>
    <path d="M390,410 Q402,410 402,398 Q402,410 414,410 Q402,410 402,422 Q402,410 390,410 Z"/>
  </g>
</svg>
